<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NJU Agent</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="会话导航">
      <div class="brand"><div class="brand-mark">N</div><div><strong>NJU Agent</strong><span>本地编程助手</span></div></div>
      <button class="new-chat" id="newChat"><span class="plus">+</span> 新对话</button>
      <div class="side-heading"><span>会话</span><button id="refresh" class="icon-button" title="刷新会话">↻</button></div>
      <nav id="sessions" class="sessions"></nav>
      <section id="modifiedFilesPanel" class="modified-files-panel" aria-label="已修改文件"><div class="side-heading"><span>已修改文件</span></div><nav id="modifiedFiles" class="modified-files"></nav></section>
      <div class="sidebar-footer"><span class="status-dot"></span><span>本地工作区已连接</span></div>
    </aside>
    <main class="main-panel">
      <header class="topbar"><div class="breadcrumb"><span class="folder-icon">□</span><span id="sessionTitle">新对话</span></div><div class="top-actions"><button class="icon-button" title="工作区">⌘</button><button class="icon-button" title="更多">•••</button></div></header>
      <section id="messages" class="messages" aria-live="polite"><div class="empty-state"><div class="empty-mark">N</div><h1>开始编程工作</h1><p>描述要修改、检查或运行的代码任务。</p></div></section>
      <div class="composer-wrap"><form id="composer" class="composer"><textarea id="prompt" rows="1" placeholder="输入任务..." aria-label="任务输入"></textarea><div id="attachmentList" class="attachment-list" aria-live="polite"></div><div id="attachmentNotice" class="attachment-notice" role="status"></div><div class="composer-bottom"><div class="composer-left"><label for="attachments" class="attachment-button" title="添加代码或文本附件" aria-label="添加代码或文本附件">&#128206;</label><input id="attachments" type="file" multiple accept=".c,.h,.cc,.cpp,.cxx,.hpp,.py,.pyi,.json,.jsonl,.csv,.tsv,.md,.txt,.yaml,.yml,.toml,.ini,.xml,.html,.htm,.css,.js,.jsx,.ts,.tsx,.java,.go,.rs,.sh,.sql,.bat,.ps1,.cmake,Makefile,Dockerfile"><span class="hint">Enter 发送 · Shift+Enter 换行</span></div><button id="send" class="send-button" title="发送" aria-label="发送">↑</button></div></form></div>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
