[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nju-agent"
version = "0.6.0"
description = "A minimal programming agent for the Nanjing University Software Institute assessment."
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.scripts]
nju-agent = "nju_agent.cli:main"

[tool.setuptools.packages.find]
include = ["nju_agent*"]

[tool.setuptools.package-data]
nju_agent = ["web/*.html", "web/*.css", "web/*.js"]
